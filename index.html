<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №11 - Language Learning</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #eef2f7;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 460px;
            background-color: #ffffff;
            border-radius: 16px;
            padding: 28px 24px;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .app-title {
            font-size: 20px;
            font-weight: 700;
            color: #334155;
            text-align: center;
        }

        .word-card {
            width: 100%;
            height: 210px;
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s, border-color 0.25s, background-color 0.25s;
            padding: 20px;
            text-align: center;
        }

        .word-card:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .word-card:active {
            transform: scale(0.99);
        }

        .word-card.correct {
            background-color: #f0fdf4;
            border-color: #22c55e;
        }

        .word-card.wrong {
            background-color: #fef2f2;
            border-color: #ef4444;
        }

        .word-text {
            font-size: 32px;
            font-weight: 700;
            color: #0f172a;
        }

        .card-hint {
            font-size: 13px;
            color: #64748b;
        }

        .card-feedback {
            font-size: 15px;
            font-weight: 600;
            min-height: 20px;
        }

        .card-feedback.correct-text {
            color: #16a34a;
        }

        .card-feedback.wrong-text {
            color: #dc2626;
        }

        .nav-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .nav-btn {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            color: #334155;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .step-counter {
            font-size: 17px;
            font-weight: 700;
            color: #1e293b;
            min-width: 60px;
            text-align: center;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .translation-input {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
        }

        .translation-input:focus {
            border-color: #3b82f6;
        }

        .translation-input.input-error {
            border-color: #ef4444;
        }

        .validation-msg {
            font-size: 13px;
            color: #dc2626;
            text-align: center;
            min-height: 18px;
        }

        .stats-section {
            width: 100%;
            border-top: 1px solid #e2e8f0;
            padding-top: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .stats-title {
            font-size: 15px;
            font-weight: 700;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stats-grid {
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .stat-box {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-weight: 700;
        }

        .stat-correct {
            background-color: #f0fdf4;
            color: #16a34a;
        }

        .stat-wrong {
            background-color: #fef2f2;
            color: #dc2626;
        }

        .stat-number {
            font-size: 20px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.55);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-window {
            width: 100%;
            max-width: 380px;
            background-color: #ffffff;
            border-radius: 16px;
            padding: 28px 24px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.25);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
        }

        .modal-score {
            font-size: 16px;
            color: #475569;
        }

        .modal-level {
            font-size: 20px;
            font-weight: 700;
            color: #2563eb;
            padding: 10px;
            background-color: #eff6ff;
            border-radius: 10px;
        }

        .btn-restart {
            margin-top: 6px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-restart:hover {
            background-color: #2563eb;
        }

        @media (max-width: 480px) {
            .app-container {
                padding: 20px 16px;
            }

            .word-card {
                height: 180px;
            }

            .word-text {
                font-size: 26px;
            }
        }
    </style>
    <script>
        $(document).ready(function () {
            const baseWords = [
                { word: "always", translation: "завжди" },
                { word: "never", translation: "ніколи" },
                { word: "sometimes", translation: "іноді" },
                { word: "usually", translation: "зазвичай" },
                { word: "often", translation: "часто" },
                { word: "morning", translation: "ранок" },
                { word: "evening", translation: "вечір" },
                { word: "friend", translation: "друг" },
                { word: "world", translation: "світ" },
                { word: "knowledge", translation: "знання" }
            ];

            let sessionWords = [];
            let currentIndex = 0;
            let correctCount = 0;
            let wrongCount = 0;

            function shuffleWords(sourceArray) {
                const clonedArray = sourceArray.map(function (item) {
                    return {
                        word: item.word,
                        translation: item.translation,
                        userAnswer: "",
                        status: "pending"
                    };
                });

                for (let index = clonedArray.length - 1; index > 0; index = index - 1) {
                    const swapIndex = Math.floor(Math.random() * (index + 1));
                    const tempItem = clonedArray[index];
                    clonedArray[index] = clonedArray[swapIndex];
                    clonedArray[swapIndex] = tempItem;
                }

                return clonedArray;
            }

            function getLanguageLevel(score, total) {
                const percent = (score / total) * 100;

                if (percent >= 90) {
                    return "Високий (Advanced)";
                } else if (percent >= 70) {
                    return "Достатній (Upper-Intermediate)";
                } else if (percent >= 50) {
                    return "Середній (Intermediate)";
                } else {
                    return "Початковий (Beginner)";
                }
            }

            function renderCurrentCard() {
                const currentItem = sessionWords[currentIndex];
                const cardElement = $("#word-card");
                const inputElement = $("#translation-input");
                const feedbackElement = $("#card-feedback");

                $("#word-text").text(currentItem.word);
                $("#step-counter").text((currentIndex + 1) + "/" + sessionWords.length);
                $("#validation-msg").text("");
                inputElement.removeClass("input-error");

                cardElement.removeClass("correct wrong");
                feedbackElement.removeClass("correct-text wrong-text").text("");

                if (currentItem.status === "pending") {
                    inputElement.val("").prop("disabled", false).focus();
                    $("#card-hint").text("Введіть переклад і натисніть на картку");
                } else {
                    inputElement.val(currentItem.userAnswer).prop("disabled", true);
                    $("#card-hint").text("Слово перевірено");

                    if (currentItem.status === "correct") {
                        cardElement.addClass("correct");
                        feedbackElement.addClass("correct-text").text("Правильно!");
                    } else {
                        cardElement.addClass("wrong");
                        feedbackElement.addClass("wrong-text").text("Правильно: " + currentItem.translation);
                    }
                }

                $("#prev-btn").prop("disabled", currentIndex === 0);
                $("#next-btn").prop("disabled", currentIndex === sessionWords.length - 1);
            }

            function updateStats() {
                $("#correct-count").text(correctCount);
                $("#wrong-count").text(wrongCount);
            }

            function showResultModal() {
                const totalCount = sessionWords.length;
                const levelText = getLanguageLevel(correctCount, totalCount);

                $("#modal-score").text("Правильних відповідей: " + correctCount + " з " + totalCount);
                $("#modal-level").text(levelText);
                $("#modal-overlay").css("display", "flex").hide().fadeIn(200);
            }

            function moveToNextPending() {
                const nextPendingIndex = sessionWords.findIndex(function (item) {
                    return item.status === "pending";
                });

                if (nextPendingIndex !== -1) {
                    currentIndex = nextPendingIndex;
                    renderCurrentCard();
                }
            }

            function checkTranslation() {
                const currentItem = sessionWords[currentIndex];

                if (currentItem.status !== "pending") {
                    return;
                }

                const rawValue = $("#translation-input").val().trim();

                if (rawValue === "") {
                    $("#validation-msg").text("Введіть переклад слова перед перевіркою");
                    $("#translation-input").addClass("input-error").focus();
                    return;
                }

                if (!/^[а-яА-ЯіІїЇєЄґҐ'\s-]+$/.test(rawValue)) {
                    $("#validation-msg").text("Використовуйте українські літери для перекладу");
                    $("#translation-input").addClass("input-error").focus();
                    return;
                }

                currentItem.userAnswer = rawValue;

                if (rawValue.toLowerCase() === currentItem.translation.toLowerCase()) {
                    currentItem.status = "correct";
                    correctCount = correctCount + 1;
                } else {
                    currentItem.status = "wrong";
                    wrongCount = wrongCount + 1;
                }

                updateStats();
                renderCurrentCard();

                const answeredTotal = correctCount + wrongCount;

                if (answeredTotal === sessionWords.length) {
                    setTimeout(showResultModal, 600);
                } else {
                    setTimeout(moveToNextPending, 800);
                }
            }

            function startSession() {
                sessionWords = shuffleWords(baseWords);
                currentIndex = 0;
                correctCount = 0;
                wrongCount = 0;

                updateStats();
                renderCurrentCard();
                $("#modal-overlay").fadeOut(150);
            }

            $("#word-card").on("click", function () {
                checkTranslation();
            });

            $("#translation-input").on("keydown", function (event) {
                if (event.key === "Enter") {
                    checkTranslation();
                }
            });

            $("#prev-btn").on("click", function () {
                if (currentIndex > 0) {
                    currentIndex = currentIndex - 1;
                    renderCurrentCard();
                }
            });

            $("#next-btn").on("click", function () {
                if (currentIndex < sessionWords.length - 1) {
                    currentIndex = currentIndex + 1;
                    renderCurrentCard();
                }
            });

            $("#restart-btn").on("click", function () {
                startSession();
            });

            startSession();
        });
    </script>
</head>
<body>
    <main class="app-container">
        <h1 class="app-title">Language Learning</h1>

        <div class="word-card" id="word-card">
            <div class="word-text" id="word-text"></div>
            <div class="card-feedback" id="card-feedback"></div>
            <div class="card-hint" id="card-hint"></div>
        </div>

        <div class="nav-row">
            <button class="nav-btn" id="prev-btn" type="button">&larr;</button>
            <div class="step-counter" id="step-counter">1/10</div>
            <button class="nav-btn" id="next-btn" type="button">&rarr;</button>
        </div>

        <div class="input-group">
            <input class="translation-input" id="translation-input" type="text" placeholder="Введіть переклад...">
            <div class="validation-msg" id="validation-msg"></div>
        </div>

        <section class="stats-section">
            <div class="stats-title">Статистика</div>
            <div class="stats-grid">
                <div class="stat-box stat-correct">
                    <span>Вірно</span>
                    <span class="stat-number" id="correct-count">0</span>
                </div>
                <div class="stat-box stat-wrong">
                    <span>Невірно</span>
                    <span class="stat-number" id="wrong-count">0</span>
                </div>
            </div>
        </section>
    </main>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-window">
            <h2 class="modal-title">Результат тестування</h2>
            <p class="modal-score" id="modal-score"></p>
            <div class="modal-level" id="modal-level"></div>
            <button class="btn-restart" id="restart-btn" type="button">Пройти ще раз</button>
        </div>
    </div>
</body>
</html>
